<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1A1A1A">
<title>Área da equipe · Matheus Silva Advocacia</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- Porta de entrada da área da equipe. O portal roda no servidor do escritório; quando o endereço
     equipe.matheussilvaadv.com.br estiver ligado, basta trocar o DESTINO abaixo. -->
<meta http-equiv="refresh" content="0;url=https://guias-clientes-production.up.railway.app/equipe/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120D10;color:#fff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .c{text-align:center;padding:24px}
  img{width:58px;height:58px;border-radius:16px;background:#0A0510;padding:6px;box-shadow:0 12px 40px rgba(200,16,46,.35)}
  p{color:#BDBDC2}
  a{color:#F5B82E}
  .b{width:120px;height:3px;border-radius:3px;background:#2A2A2C;margin:18px auto 0;overflow:hidden}
  .b i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#C8102E,#F5B82E);animation:x 1s ease-in-out infinite}
  @keyframes x{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="c">
  <img src="assets/logo-ms.jpg" alt="Matheus Silva Advocacia">
  <p>Abrindo a área da equipe…<br><a id="ir" href="https://guias-clientes-production.up.railway.app/equipe/">Toque aqui se não abrir</a></p>
  <div class="b"><i></i></div>
</div>
<script>
  var DESTINO = "https://guias-clientes-production.up.railway.app/equipe/";
  document.getElementById("ir").href = DESTINO;
  location.replace(DESTINO);
</script>
</body>
</html>
